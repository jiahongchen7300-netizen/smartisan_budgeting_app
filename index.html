<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smartisan Ledger & Budget</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            smartisan: {
              red: '#C23A2B',
              redHover: '#A82F22',
              bgLight: '#E8E3D9',
              bgWood: '#2B2623',
              paper: '#F7F4EB',
              paperDark: '#1C1917',
              borderLight: '#D3CCBE',
              borderDark: '#3A3532',
              textMain: '#2A2421',
              accentGold: '#D4AF37'
            }
          },
          boxShadow: {
            'tactile': '0 2px 5px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.6)',
            'inset-shadow': 'inset 0 2px 4px rgba(0,0,0,0.15)',
            'wood': '0 10px 25px -5px rgba(0, 0, 0, 0.5)'
          }
        }
      }
    }
  </script>
  <style>
    /* Skeuomorphic & Tactile Styling */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .paper-texture {
      background-image: radial-gradient(#d1ca2210 1px, transparent 1px);
      background-size: 8px 8px;
    }
    .stitch-border {
      border: 1px dashed rgba(0,0,0,0.2);
    }
    .dark .stitch-border {
      border: 1px dashed rgba(255,255,255,0.15);
    }
    .tactile-btn {
      transition: all 0.08s ease-in-out;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .tactile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2), inset 0 1px 2px rgba(0,0,0,0.2);
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
  </style>
</head>
<body class="bg-smartisan-bgLight dark:bg-smartisan-bgWood text-smartisan-textMain dark:text-gray-200 min-h-screen pb-20 selection:bg-smartisan-red selection:text-white transition-colors duration-200">

  <!-- Header Bar -->
  <header class="sticky top-0 z-30 bg-[#2C2825] text-[#E5DCCB] border-b border-[#1A1816] shadow-md px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-smartisan-red flex items-center justify-center text-white font-bold text-sm shadow-inner border border-red-400/30">
        <i class="fa-solid me-0.5 fa-book"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-[#F3ECE1]" id="appTitle">Smartisan Ledger</h1>
        <p class="text-[10px] text-gray-400" id="appSubtitle">Tactile Personal Finance</p>
      </div>
    </div>

    <!-- Top Controls -->
    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="w-8 h-8 rounded bg-[#3D3733] border border-[#524B45] text-amber-200 flex items-center justify-center tactile-btn text-xs" title="Toggle Theme">
        <i class="fa-solid fa-palette"></i>
      </button>
      <button onclick="openSettings()" class="w-8 h-8 rounded bg-[#3D3733] border border-[#524B45] text-gray-300 flex items-center justify-center tactile-btn text-xs" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-3 space-y-4">

    <!-- Idea Pill & Voice Command Bar -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile relative stitch-border">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-[#C23A2B] fa-capsules"></i> <span data-i18n="expressLog">Idea Pill Quick Express Log</span>
        </span>
        <span id="voiceStatus" class="text-[10px] text-gray-400 italic">Ready</span>
      </div>

      <!-- Natural Language Input -->
      <div class="relative flex items-center">
        <input type="text" id="nlpInput" placeholder="e.g. Coffee 4.50 or Gas 35 Chase" 
          class="w-full pl-3 pr-20 py-2.5 bg-white dark:bg-[#252220] border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-smartisan-red shadow-inner">
        
        <div class="absolute right-1 flex items-center gap-1">
          <button onclick="startVoiceRecognition()" id="micBtn" class="w-8 h-8 rounded-md bg-amber-600 hover:bg-amber-700 text-white flex items-center justify-center tactile-btn shadow" title="Voice Input">
            <i class="fa-solid fa-microphone text-xs"></i>
          </button>
          <button onclick="parseAndAddNLP()" class="w-8 h-8 rounded-md bg-smartisan-red hover:bg-smartisan-redHover text-white flex items-center justify-center tactile-btn shadow" title="Submit">
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- NEW: Item Preset Quick Badges (Click Item -> Input Amount) -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile stitch-border">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt"></i> <span data-i18n="quickItemPresets">1-Tap Item Presets</span>
        </span>
        <button onclick="openEditPresetsModal()" class="text-[11px] text-smartisan-red hover:underline font-medium">
          <i class="fa-solid fa-pen-to-square"></i> <span data-i18n="editItems">Edit Items</span>
        </button>
      </div>

      <!-- Presets Grid -->
      <div id="quickItemsContainer" class="grid grid-cols-4 gap-2">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Account Net Worth & Accounts Carousel -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile stitch-border">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-wallet"></i> <span data-i18n="accountsHeading">Accounts & Net Liquid</span>
        </span>
        <span id="netWorthDisplay" class="text-sm font-black text-emerald-600 dark:text-emerald-400">$0.00</span>
      </div>

      <div id="accountsList" class="flex gap-2 overflow-x-auto pb-1 pt-1 scrollbar-none">
        <!-- Account cards rendered here -->
      </div>
    </section>

    <!-- Visual Analytics Canvas Charts -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile stitch-border">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-chart-pie"></i> <span data-i18n="analyticsHeading">Monthly Breakdown</span>
        </span>
        <select id="analyticsMonthSelect" onchange="renderAnalytics()" class="text-xs bg-white dark:bg-[#252220] border border-gray-300 dark:border-gray-700 rounded px-2 py-1">
          <!-- Dynamic months -->
        </select>
      </div>

      <div class="relative w-full h-48 flex items-center justify-center">
        <canvas id="categoryPieChart" class="max-w-full max-h-full"></canvas>
      </div>
    </section>

    <!-- Monthly Budget Category Limits -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile stitch-border">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders"></i> <span data-i18n="budgetLimitsHeading">Category Budgets</span>
        </span>
        <button onclick="openBudgetLimitsModal()" class="text-[11px] text-smartisan-red hover:underline font-medium">
          <i class="fa-solid fa-[#C23A2B] fa-gear"></i> <span data-i18n="setLimits">Set Limits</span>
        </button>
      </div>

      <div id="categoryBudgetsContainer" class="space-y-2.5">
        <!-- Budget bars rendered dynamically -->
      </div>
    </section>

    <!-- Transaction History Logs -->
    <section class="bg-smartisan-paper dark:bg-smartisan-paperDark rounded-xl p-3 border border-smartisan-borderLight dark:border-smartisan-borderDark shadow-tactile stitch-border">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check"></i> <span data-i18n="historyHeading">Transaction History</span>
        </span>
        <input type="text" id="historySearchInput" onkeyup="filterTransactions()" placeholder="Search..." class="text-xs px-2 py-1 bg-white dark:bg-[#252220] border border-gray-300 dark:border-gray-700 rounded w-28">
      </div>

      <div id="transactionHistoryList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- Transactions list rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Quick Amount Entry Modal for Presets -->
  <div id="quickAmountModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-smartisan-paper dark:bg-smartisan-paperDark w-full max-w-sm rounded-t-2xl sm:rounded-2xl border border-smartisan-borderLight dark:border-smartisan-borderDark p-4 shadow-2xl animate-slide-up">
      <div class="flex items-center justify-between pb-3 border-b border-gray-300 dark:border-gray-700">
        <div class="flex items-center gap-2">
          <span id="modalItemIcon" class="text-xl">☕</span>
          <div>
            <h3 id="modalItemTitle" class="font-bold text-sm">Coffee</h3>
            <p id="modalItemCategory" class="text-[10px] text-gray-500">Food & Dining</p>
          </div>
        </div>
        <button onclick="closeQuickAmountModal()" class="text-gray-400 hover:text-gray-600 text-lg">&times;</button>
      </div>

      <!-- Keypad Display -->
      <div class="my-4">
        <div class="text-xs text-gray-500 mb-1" data-i18n="enterAmount">Enter Expense Amount</div>
        <div class="bg-white dark:bg-[#252220] border border-gray-300 dark:border-gray-700 rounded-lg p-3 text-right">
          <span class="text-xs text-gray-400 mr-1">$</span>
          <span id="keypadDisplay" class="text-2xl font-black text-smartisan-textMain dark:text-white">0</span>
        </div>
      </div>

      <!-- Bank Account Selector -->
      <div class="mb-4">
        <label class="block text-[11px] font-bold text-gray-500 mb-1" data-i18n="selectAccount">Account</label>
        <select id="keypadAccountSelect" class="w-full text-xs p-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#252220]">
          <!-- Rendered dynamically -->
        </select>
      </div>

      <!-- Tactile Keypad -->
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button onclick="keypadPress('1')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">1</button>
        <button onclick="keypadPress('2')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">2</button>
        <button onclick="keypadPress('3')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">3</button>
        <button onclick="keypadPress('4')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">4</button>
        <button onclick="keypadPress('5')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">5</button>
        <button onclick="keypadPress('6')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">6</button>
        <button onclick="keypadPress('7')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">7</button>
        <button onclick="keypadPress('8')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">8</button>
        <button onclick="keypadPress('9')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">9</button>
        <button onclick="keypadPress('.')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">.</button>
        <button onclick="keypadPress('0')" class="py-3 bg-white dark:bg-[#2A2624] border border-gray-300 dark:border-gray-700 rounded-lg font-bold text-lg tactile-btn">0</button>
        <button onclick="keypadPress('DEL')" class="py-3 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 rounded-lg font-bold text-sm tactile-btn"><i class="fa-solid fa-backspace"></i></button>
      </div>

      <button onclick="confirmKeypadTransaction()" class="w-full py-3 bg-smartisan-red hover:bg-smartisan-redHover text-white font-bold rounded-lg tactile-btn shadow flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i> <span data-i18n="confirmLog">Confirm & Log Expense</span>
      </button>
    </div>
  </div>

  <!-- Edit Preset Items Modal -->
  <div id="editPresetsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-smartisan-paper dark:bg-smartisan-paperDark w-full max-w-sm rounded-xl border border-smartisan-borderLight dark:border-smartisan-borderDark p-4 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm" data-i18n="editPresetsTitle">Configure Item Presets</h3>
        <button onclick="closeEditPresetsModal()" class="text-gray-400 text-lg">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-500">Item Title</label>
          <input type="text" id="newPresetName" placeholder="e.g. Lunch" class="w-full text-xs p-2 rounded border bg-white dark:bg-[#252220]">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-gray-500">Icon (Emoji)</label>
            <input type="text" id="newPresetIcon" placeholder="🍱" class="w-full text-xs p-2 rounded border bg-white dark:bg-[#252220]">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-500">Category</label>
            <select id="newPresetCategory" class="w-full text-xs p-2 rounded border bg-white dark:bg-[#252220]">
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Groceries">Groceries</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Entertainment">Entertainment</option>
            </select>
          </div>
        </div>
        <button onclick="addCustomPreset()" class="w-full py-2 bg-emerald-600 text-white rounded font-bold text-xs tactile-btn">
          + Add New Preset
        </button>
      </div>

      <div class="border-t pt-2 max-h-40 overflow-y-auto space-y-1.5" id="presetItemsManageList">
        <!-- Render existing items to delete if needed -->
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-smartisan-paper dark:bg-smartisan-paperDark w-full max-w-sm rounded-xl border border-smartisan-borderLight dark:border-smartisan-borderDark p-4 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm" data-i18n="settings">Settings</h3>
        <button onclick="closeSettings()" class="text-gray-400 text-lg">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-gray-500 mb-1" data-i18n="language">Language</label>
          <select id="langSelect" onchange="changeLanguage(this.value)" class="w-full p-2 rounded border bg-white dark:bg-[#252220]">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="es">Español</option>
          </select>
        </div>

        <div class="pt-2 border-t">
          <label class="block font-bold text-gray-500 mb-1" data-i18n="dataManagement">Data Backup & Restore</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="exportDataJSON()" class="py-2 bg-blue-600 text-white rounded font-bold tactile-btn">
              <i class="fa-solid fa-download"></i> Export JSON
            </button>
            <button onclick="triggerImportJSON()" class="py-2 bg-gray-600 text-white rounded font-bold tactile-btn">
              <i class="fa-solid fa-upload"></i> Import JSON
            </button>
            <input type="file" id="importFileInput" onchange="importDataJSON(event)" class="hidden" accept=".json">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // --- APP STATE ---
    let appState = {
      language: 'en',
      theme: 'light',
      accounts: [
        { id: 'acc_1', name: 'Chase Checking', balance: 2450.00, type: 'checking' },
        { id: 'acc_2', name: 'Amex Savings', balance: 8200.00, type: 'savings' },
        { id: 'acc_3', name: 'Cash', balance: 180.00, type: 'cash' }
      ],
      quickPresets: [
        { id: 'p1', title: 'Coffee', icon: '☕', category: 'Food & Dining' },
        { id: 'p2', title: 'Meal / Dining', icon: '🍔', category: 'Food & Dining' },
        { id: 'p3', title: 'Gasoline', icon: '⛽', category: 'Transportation' },
        { id: 'p4', title: 'Groceries', icon: '🛒', category: 'Groceries' },
        { id: 'p5', title: 'Shopping', icon: '🛍️', category: 'Shopping' },
        { id: 'p6', title: 'Movie / Fun', icon: '🎬', category: 'Entertainment' },
        { id: 'p7', title: 'Bus / Subway', icon: '🚌', category: 'Transportation' },
        { id: 'p8', title: 'Utility Bill', icon: '💡', category: 'Bills & Utilities' }
      ],
      categoryLimits: {
        'Food & Dining': 500,
        'Transportation': 200,
        'Groceries': 400,
        'Shopping': 300,
        'Bills & Utilities': 600,
        'Entertainment': 150
      },
      transactions: [
        { id: 'tx1', title: 'Coffee', amount: 4.50, category: 'Food & Dining', accountId: 'acc_1', date: new Date().toISOString().split('T')[0], type: 'expense' },
        { id: 'tx2', title: 'Gasoline', amount: 35.00, category: 'Transportation', accountId: 'acc_1', date: new Date().toISOString().split('T')[0], type: 'expense' }
      ]
    };

    let activePreset = null;
    let currentKeypadValue = "0";

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();
      renderAll();
    });

    function saveState() {
      localStorage.setItem('smartisan_ledger_state', JSON.stringify(appState));
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('smartisan_ledger_state');
      if (saved) {
        try {
          appState = { ...appState, ...JSON.parse(saved) };
        } catch(e) { console.error('Error loading state', e); }
      }
    }

    // --- RENDER FUNCTIONS ---
    function renderAll() {
      renderPresets();
      renderAccounts();
      renderCategoryBudgets();
      renderTransactions();
      renderAnalytics();
    }

    // Render Quick Item Presets
    function renderPresets() {
      const container = document.getElementById('quickItemsContainer');
      container.innerHTML = appState.quickPresets.map(preset => `
        <button onclick="openQuickAmountModal('${preset.id}')" 
          class="flex flex-col items-center justify-center p-2.5 bg-white dark:bg-[#252220] border border-gray-200 dark:border-gray-700/80 rounded-xl tactile-btn shadow-sm text-center">
          <span class="text-2xl mb-1">${preset.icon}</span>
          <span class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate w-full">${preset.title}</span>
          <span class="text-[9px] text-gray-400 truncate w-full">${preset.category}</span>
        </button>
      `).join('');
    }

    // Keypad & Preset Modal Logic
    function openQuickAmountModal(presetId) {
      activePreset = appState.quickPresets.find(p => p.id === presetId);
      if (!activePreset) return;

      document.getElementById('modalItemIcon').innerText = activePreset.icon;
      document.getElementById('modalItemTitle').innerText = activePreset.title;
      document.getElementById('modalItemCategory').innerText = activePreset.category;

      currentKeypadValue = "0";
      updateKeypadDisplay();

      // Populate accounts dropdown
      const select = document.getElementById('keypadAccountSelect');
      select.innerHTML = appState.accounts.map(acc => `
        <option value="${acc.id}">${acc.name} ($${acc.balance.toFixed(2)})</option>
      `).join('');

      document.getElementById('quickAmountModal').classList.remove('hidden');
    }

    function closeQuickAmountModal() {
      document.getElementById('quickAmountModal').classList.add('hidden');
      activePreset = null;
    }

    function keypadPress(val) {
      if (val === 'DEL') {
        currentKeypadValue = currentKeypadValue.length > 1 ? currentKeypadValue.slice(0, -1) : "0";
      } else if (val === '.') {
        if (!currentKeypadValue.includes('.')) currentKeypadValue += '.';
      } else {
        if (currentKeypadValue === "0") currentKeypadValue = val;
        else currentKeypadValue += val;
      }
      updateKeypadDisplay();
    }

    function updateKeypadDisplay() {
      document.getElementById('keypadDisplay').innerText = currentKeypadValue;
    }

    function confirmKeypadTransaction() {
      const amount = parseFloat(currentKeypadValue);
      if (isNaN(amount) || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      const accountId = document.getElementById('keypadAccountSelect').value;
      const account = appState.accounts.find(a => a.id === accountId);

      // Create transaction
      const newTx = {
        id: 'tx_' + Date.now(),
        title: activePreset.title,
        amount: amount,
        category: activePreset.category,
        accountId: accountId,
        date: new Date().toISOString().split('T')[0],
        type: 'expense'
      };

      // Deduct account balance
      if (account) {
        account.balance -= amount;
      }

      appState.transactions.unshift(newTx);
      saveState();
      renderAll();
      closeQuickAmountModal();
    }

    // Accounts Render
    function renderAccounts() {
      const container = document.getElementById('accountsList');
      let total = 0;

      container.innerHTML = appState.accounts.map(acc => {
        total += acc.balance;
        return `
          <div class="min-w-[130px] p-2.5 bg-white dark:bg-[#252220] border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm">
            <div class="text-[10px] text-gray-400 font-medium truncate">${acc.name}</div>
            <div class="text-sm font-bold text-gray-800 dark:text-gray-100">$${acc.balance.toFixed(2)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('netWorthDisplay').innerText = `$${total.toFixed(2)}`;
    }

    // Category Budgets
    function renderCategoryBudgets() {
      const container = document.getElementById('categoryBudgetsContainer');
      const currentMonth = new Date().toISOString().slice(0, 7);

      container.innerHTML = Object.entries(appState.categoryLimits).map(([cat, limit]) => {
        const spent = appState.transactions
          .filter(t => t.category === cat && t.date.startsWith(currentMonth) && t.type === 'expense')
          .reduce((sum, t) => sum + t.amount, 0);
        
        const pct = Math.min(100, Math.round((spent / limit) * 100));
        let colorClass = 'bg-emerald-500';
        if (pct > 80) colorClass = 'bg-amber-500';
        if (pct >= 100) colorClass = 'bg-red-500';

        return `
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="font-medium">${cat}</span>
              <span class="text-gray-500">$${spent.toFixed(0)} / $${limit}</span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
              <div class="${colorClass} h-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Transaction History
    function renderTransactions() {
      const container = document.getElementById('transactionHistoryList');
      container.innerHTML = appState.transactions.map(tx => `
        <div class="flex items-center justify-between p-2 bg-white dark:bg-[#252220] border border-gray-200 dark:border-gray-700/60 rounded-lg text-xs">
          <div>
            <div class="font-bold">${tx.title}</div>
            <div class="text-[10px] text-gray-400">${tx.category} • ${tx.date}</div>
          </div>
          <div class="font-black ${tx.type === 'expense' ? 'text-red-500' : 'text-emerald-500'}">
            ${tx.type === 'expense' ? '-' : '+'}$${tx.amount.toFixed(2)}
          </div>
        </div>
      `).join('');
    }

    // Simple Canvas Analytics Chart
    function renderAnalytics() {
      const canvas = document.getElementById('categoryPieChart');
      const ctx = canvas.getContext('2d');
      canvas.width = 200;
      canvas.height = 200;

      const totals = {};
      appState.transactions.forEach(t => {
        if (t.type === 'expense') totals[t.category] = (totals[t.category] || 0) + t.amount;
      });

      const totalSpent = Object.values(totals).reduce((a, b) => a + b, 0);
      if (totalSpent === 0) {
        ctx.fillStyle = '#888';
        ctx.font = '12px sans-serif';
        ctx.fillText('No expenses yet', 55, 105);
        return;
      }

      const colors = ['#C23A2B', '#D4AF37', '#2563EB', '#10B981', '#8B5CF6', '#F59E0B'];
      let startAngle = 0;
      let i = 0;

      Object.entries(totals).forEach(([cat, amt]) => {
        const sliceAngle = (amt / totalSpent) * 2 * Math.PI;
        ctx.beginPath();
        ctx.arc(100, 100, 70, startAngle, startAngle + sliceAngle);
        ctx.lineTo(100, 100);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += sliceAngle;
        i++;
      });
    }

    // Natural Language Parser Input
    function parseAndAddNLP() {
      const input = document.getElementById('nlpInput').value.trim();
      if (!input) return;

      const matchAmount = input.match(/\d+(\.\d+)?/);
      const amount = matchAmount ? parseFloat(matchAmount[0]) : 0;
      const title = input.replace(/\d+(\.\d+)?/, '').trim() || 'Expense';

      if (amount > 0) {
        appState.transactions.unshift({
          id: 'tx_' + Date.now(),
          title: title,
          amount: amount,
          category: 'Food & Dining',
          accountId: appState.accounts[0].id,
          date: new Date().toISOString().split('T')[0],
          type: 'expense'
        });
        if (appState.accounts[0]) appState.accounts[0].balance -= amount;
        saveState();
        renderAll();
        document.getElementById('nlpInput').value = '';
      }
    }

    // Voice Input Toggle Placeholder
    function startVoiceRecognition() {
      alert("Voice recognition initialized. Speak 'Coffee 5 dollars'");
    }

    // Settings Modal
    function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

    // Theme Toggle
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
