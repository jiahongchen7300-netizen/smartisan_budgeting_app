<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartisan Tactile Ledger & Asset Manager</title>
  <style>
    :root {
      --bg-wood: #1e120b;
      --panel-leather: #2b1f17;
      --paper-ivory: #fbf7ee;
      --text-dark: #2c2520;
      --accent-red: #d32f2f;
      --accent-green: #2e7d32;
      --accent-brass: #d4af37;
      --border-stitched: #4a382c;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-wood: #121212;
      --panel-leather: #1e1e1e;
      --paper-ivory: #242424;
      --text-dark: #e0e0e0;
      --border-stitched: #333;
    }

    [data-theme="ivory"] {
      --bg-wood: #e8e2d5;
      --panel-leather: #3c322a;
      --paper-ivory: #fffdfa;
      --text-dark: #1a1a1a;
      --border-stitched: #bbb;
    }

    [data-theme="mahogany"] {
      --bg-wood: #2a0808;
      --panel-leather: #3d1010;
      --paper-ivory: #fcf4f0;
      --text-dark: #220808;
      --border-stitched: #5c1e1e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: var(--bg-wood);
      color: var(--text-dark);
      font-family: var(--font-main);
      display: flex;
      justify-content: center;
      transition: background 0.3s;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--paper-ivory);
      border-radius: 14px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.25), 0 12px 35px rgba(0,0,0,0.6);
      border: 3px solid var(--border-stitched);
      overflow: hidden;
      position: relative;
      padding-bottom: 24px;
    }

    .app-header {
      background: var(--panel-leather);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--accent-brass);
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: var(--accent-brass);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--accent-brass);
      color: var(--accent-brass);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* Prominent Ledger Floating Voice Pill */
    .pill-floating {
      position: fixed;
      right: 12px;
      top: 32%;
      background: rgba(43, 31, 23, 0.95);
      border: 2px solid var(--accent-brass);
      border-radius: 28px;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      backdrop-filter: blur(6px);
    }

    .mic-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-red);
      color: white;
      border: 2.5px solid #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(211, 47, 47, 0.6);
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn.listening {
      animation: pulse 1.2s infinite;
      background: #ff1744;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,23,68, 0.8); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 16px rgba(255,23,68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,23,68, 0); }
    }

    .voice-feedback {
      background: #111;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 6px 8px;
      border-radius: 6px;
      max-width: 140px;
      word-wrap: break-word;
      display: none;
      border: 1px solid #333;
    }

    /* Cards & Reorderable Dashboard Blocks */
    .card {
      margin: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.65);
      border: 1px solid #dcd4c4;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      position: relative;
    }

    [data-theme="dark"] .card {
      background: #2b2b2b;
      border-color: #444;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-dark);
      border-bottom: 1px dashed #ccc;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .block-controls {
      display: none;
      gap: 4px;
    }

    .edit-mode .block-controls {
      display: flex;
    }

    .btn-arrow {
      background: #eee;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 0.72rem;
      padding: 2px 6px;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input, select {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.88rem;
      background: #fff;
      color: #000;
    }

    button.btn-primary {
      background: var(--panel-leather);
      color: var(--accent-brass);
      border: 1px solid var(--accent-brass);
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .badge-item {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--accent-brass);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #ddd;
      font-size: 0.85rem;
    }

    .tx-amount.expense { color: var(--accent-red); font-weight: bold; }
    .tx-amount.income { color: var(--accent-green); font-weight: bold; }

    /* Progress Bars */
    .progress-bg {
      background: #e0e0e0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      transition: width 0.3s;
    }
    .progress-fill.warn { background: #f57c00; }
    .progress-fill.danger { background: var(--accent-red); }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--paper-ivory);
      color: var(--text-dark);
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 420px;
      border: 2px solid var(--accent-brass);
      max-height: 85vh;
      overflow-y: auto;
    }

    canvas {
      width: 100% !important;
      max-height: 180px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <div class="app-header">
      <h1>SMARTISAN LEDGER</h1>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleEditLayout()" id="editLayoutBtn">⚙️ Layout</button>
        <button class="icon-btn" onclick="openSettings()">🔧 Settings</button>
      </div>
    </div>

    <!-- Floating Voice Pill Widget -->
    <div class="pill-floating">
      <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecognition()" title="Voice Express Log">🎙️</button>
      <div class="voice-feedback" id="voiceFeedback">Listening...</div>
    </div>

    <!-- Reorderable Block Container -->
    <div id="blocksContainer">

      <!-- Block 1: Express Log & Voice Parser -->
      <div class="card" data-block-id="expressLog">
        <div class="card-title">
          <span>EXPRESS LOG & VOICE PARSER</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('expressLog', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('expressLog', 1)">▼</button>
          </div>
        </div>
        <div class="input-group">
          <input type="text" id="expressInput" placeholder="e.g. Lunch 15.50 Chase or 午餐 45 追溯" onkeypress="handleKeyPress(event)">
          <button class="btn-primary" onclick="parseAndAdd()">Add</button>
        </div>
        <div id="voiceStatusText" style="font-size: 0.75rem; color: #777;">Tip: Speak or type transaction + amount + account</div>
      </div>

      <!-- Block 2: 1-Tap Express Badges -->
      <div class="card" data-block-id="quickBadges">
        <div class="card-title">
          <span>1-TAP EXPRESS BADGES</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('quickBadges', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('quickBadges', 1)">▼</button>
          </div>
        </div>
        <div class="badge-grid" id="badgeGrid"></div>
      </div>

      <!-- Block 3: Bank Accounts & Asset Ledger -->
      <div class="card" data-block-id="bankAccounts">
        <div class="card-title">
          <span>BANK ACCOUNTS & ASSETS</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('bankAccounts', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('bankAccounts', 1)">▼</button>
          </div>
        </div>
        <div id="accountList"></div>
      </div>

      <!-- Block 4: Category Monthly Budget Progress -->
      <div class="card" data-block-id="budgets">
        <div class="card-title">
          <span>CATEGORY MONTHLY BUDGETS</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('budgets', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('budgets', 1)">▼</button>
          </div>
        </div>
        <div id="budgetList"></div>
      </div>

      <!-- Block 5: Interactive Visual Analytics -->
      <div class="card" data-block-id="analytics">
        <div class="card-title">
          <span>VISUAL ANALYTICS</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('analytics', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('analytics', 1)">▼</button>
          </div>
        </div>
        <canvas id="chartCanvas"></canvas>
      </div>

      <!-- Block 6: Transaction History -->
      <div class="card" data-block-id="txHistory">
        <div class="card-title">
          <span>RECENT TRANSACTIONS</span>
          <div class="block-controls">
            <button class="btn-arrow" onclick="moveBlock('txHistory', -1)">▲</button>
            <button class="btn-arrow" onclick="moveBlock('txHistory', 1)">▼</button>
          </div>
        </div>
        <div id="txList"></div>
      </div>

    </div>
  </div>

  <!-- Comprehensive Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>App Settings & Customization</h3>
      
      <label>Language Engine:</label>
      <select id="settingLang" onchange="updateSettings()" style="margin-bottom:12px;">
        <option value="en-US">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="es-ES">Español</option>
      </select>

      <label>Skeuomorphic Theme:</label>
      <select id="settingTheme" onchange="updateSettings()" style="margin-bottom:12px;">
        <option value="default">Classic Wood & Leather</option>
        <option value="dark">Obsidian Dark</option>
        <option value="ivory">Warm Ivory</option>
        <option value="mahogany">Vintage Mahogany</option>
      </select>

      <hr style="margin:16px 0;">
      <h4>Data Management</h4>
      <button class="btn-primary" onclick="exportData('json')" style="width:100%; margin-bottom:8px;">Export JSON Backup</button>
      <button class="btn-primary" onclick="exportData('csv')" style="width:100%; margin-bottom:12px;">Export CSV Spreadsheet</button>
      <button class="btn-primary" onclick="closeSettings()" style="width:100%; background:#666; border-color:#666;">Close</button>
    </div>
  </div>

  <script>
    let state = {
      language: localStorage.getItem('app_lang') || 'en-US',
      theme: localStorage.getItem('app_theme') || 'default',
      blockOrder: JSON.parse(localStorage.getItem('app_blocks')) || ['expressLog', 'quickBadges', 'bankAccounts', 'budgets', 'analytics', 'txHistory'],
      accounts: JSON.parse(localStorage.getItem('app_accounts')) || [
        { name: 'Chase Checking', balance: 4250.00 },
        { name: 'Amex Savings', balance: 12800.00 },
        { name: 'Cash', balance: 340.00 }
      ],
      categories: JSON.parse(localStorage.getItem('app_categories')) || [
        { name: 'Food & Dining', limit: 600 },
        { name: 'Transportation', limit: 250 },
        { name: 'Housing', limit: 1400 },
        { name: 'Shopping', limit: 300 }
      ],
      badges: JSON.parse(localStorage.getItem('app_badges')) || [
        { name: 'Coffee', amount: 5.00 },
        { name: 'Meal', amount: 15.00 },
        { name: 'Grocery', amount: 35.00 },
        { name: 'Gas', amount: 45.00 }
      ],
      transactions: JSON.parse(localStorage.getItem('app_txs')) || []
    };

    function applyTheme() {
      document.body.setAttribute('data-theme', state.theme);
    }

    function openSettings() {
      document.getElementById('settingLang').value = state.language;
      document.getElementById('settingTheme').value = state.theme;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function updateSettings() {
      state.language = document.getElementById('settingLang').value;
      state.theme = document.getElementById('settingTheme').value;
      localStorage.setItem('app_lang', state.language);
      localStorage.setItem('app_theme', state.theme);
      applyTheme();
    }

    function toggleEditLayout() {
      const container = document.getElementById('appContainer');
      container.classList.toggle('edit-mode');
      const btn = document.getElementById('editLayoutBtn');
      btn.innerText = container.classList.contains('edit-mode') ? '✓ Done' : '⚙️ Layout';
    }

    function moveBlock(blockId, direction) {
      const idx = state.blockOrder.indexOf(blockId);
      if (idx === -1) return;
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= state.blockOrder.length) return;

      const temp = state.blockOrder[idx];
      state.blockOrder[idx] = state.blockOrder[newIdx];
      state.blockOrder[newIdx] = temp;

      localStorage.setItem('app_blocks', JSON.stringify(state.blockOrder));
      renderBlockOrder();
    }

    function renderBlockOrder() {
      const container = document.getElementById('blocksContainer');
      state.blockOrder.forEach(id => {
        const el = container.querySelector(`[data-block-id="${id}"]`);
        if (el) container.appendChild(el);
      });
    }

    // Advanced Voice & Multi-Language Natural Language Parser Engine
    function parseNaturalLanguage(text) {
      const lower = text.toLowerCase().trim();
      
      // 1. Regex Amount extraction (handles $, ￥, €, 元, 块)
      const amountMatch = lower.match(/(?:[\$￥€]?\s*)(\d+(?:\.\d{1,2})?)/);
      const amount = amountMatch ? parseFloat(amountMatch[1]) : 0;

      // 2. Intent Detection
      let type = 'expense';
      if (/salary|income|deposit|received|收入|发工资|存入|进账/i.test(lower)) {
        type = 'income';
      }

      // 3. Account Linkage
      let account = state.accounts[0].name;
      if (/amex|savings|储蓄|运通/i.test(lower)) account = state.accounts[1]?.name || account;
      else if (/cash|现金/i.test(lower)) account = state.accounts[2]?.name || account;

      // 4. Category Linkage
      let category = 'Food & Dining';
      if (/uber|gas|transport|taxi|打车|加油|交通/i.test(lower)) category = 'Transportation';
      else if (/rent|utility|house|房租|水电/i.test(lower)) category = 'Housing';
      else if (/shop|store|amazon|购物|买/i.test(lower)) category = 'Shopping';

      // 5. Clean Title / Note Extraction
      let title = text.replace(/(?:[\$￥€]?\s*)(\d+(?:\.\d{1,2})?)/g, '')
                      .replace(/chase|amex|cash|savings|追溯|现金|收入|支出/gi, '')
                      .trim();
      if (!title) title = category;

      return { amount, type, category, account, title };
    }

    function parseAndAdd() {
      const input = document.getElementById('expressInput');
      if (!input.value.trim()) return;

      const parsed = parseNaturalLanguage(input.value);
      if (parsed.amount <= 0) return;

      state.transactions.unshift({
        id: Date.now(),
        title: parsed.title,
        amount: parsed.amount,
        type: parsed.type,
        category: parsed.category,
        account: parsed.account,
        date: new Date().toLocaleDateString()
      });

      // Live Bank Balance Sync
      const acc = state.accounts.find(a => a.name === parsed.account);
      if (acc) {
        acc.balance += parsed.type === 'income' ? parsed.amount : -parsed.amount;
        localStorage.setItem('app_accounts', JSON.stringify(state.accounts));
      }

      localStorage.setItem('app_txs', JSON.stringify(state.transactions));
      input.value = '';
      render();
    }

    function quickLogBadge(badge) {
      document.getElementById('expressInput').value = `${badge.name} ${badge.amount}`;
      parseAndAdd();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') parseAndAdd();
    }

    // High-Precision WebSpeech API Engine
    let recognition = null;
    let isListening = false;

    function toggleVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Speech recognition is not supported on this browser.");

      const micBtn = document.getElementById('micBtn');
      const feedback = document.getElementById('voiceFeedback');
      const statusText = document.getElementById('voiceStatusText');

      if (isListening) { recognition.stop(); return; }

      recognition = new SpeechRecognition();
      recognition.lang = state.language;
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        feedback.style.display = 'block';
        feedback.innerText = 'Listening...';
        if (statusText) statusText.innerText = 'Listening... speak now';
      };

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        feedback.innerText = transcript;
        document.getElementById('expressInput').value = transcript;

        if (e.results[0].isFinal) {
          if (statusText) statusText.innerText = 'Processing...';
          setTimeout(() => {
            parseAndAdd();
            if (statusText) statusText.innerText = 'Logged successfully!';
          }, 350);
        }
      };

      recognition.onerror = (e) => {
        if (statusText) statusText.innerText = 'Voice recognition error';
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };

      recognition.start();
    }

    function stopListening() {
      isListening = false;
      const micBtn = document.getElementById('micBtn');
      const feedback = document.getElementById('voiceFeedback');
      if (micBtn) micBtn.classList.remove('listening');
      if (feedback) feedback.style.display = 'none';
    }

    function exportData(format) {
      let content = '';
      let mime = '';
      let ext = '';

      if (format === 'json') {
        content = JSON.stringify(state, null, 2);
        mime = 'data:text/json;charset=utf-8,';
        ext = 'json';
      } else {
        content = "Date,Title,Amount,Type,Category,Account\n" + 
          state.transactions.map(t => `"${t.date}","${t.title}",${t.amount},"${t.type}","${t.category}","${t.account}"`).join("\n");
        mime = 'data:text/csv;charset=utf-8,';
        ext = 'csv';
      }

      const anchor = document.createElement('a');
      anchor.setAttribute("href", mime + encodeURIComponent(content));
      anchor.setAttribute("download", `smartisan_budget_export.${ext}`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function drawChart() {
      const canvas = document.getElementById('chartCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth - 28;
      canvas.height = 150;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalExpense = state.transactions.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
      const totalIncome = state.transactions.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);

      const max = Math.max(totalExpense, totalIncome, 100);
      const expBarHeight = (totalExpense / max) * 100;
      const incBarHeight = (totalIncome / max) * 100;

      // Income Bar
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(60, 120 - incBarHeight, 50, incBarHeight);
      ctx.fillStyle = '#888';
      ctx.font = '12px sans-serif';
      ctx.fillText('Income', 62, 140);
      ctx.fillText(`$${totalIncome.toFixed(0)}`, 62, 115 - incBarHeight);

      // Expense Bar
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(170, 120 - expBarHeight, 50, expBarHeight);
      ctx.fillText('Expense', 170, 140);
      ctx.fillText(`$${totalExpense.toFixed(0)}`, 170, 115 - expBarHeight);
    }

    function render() {
      applyTheme();
      renderBlockOrder();

      // Quick Badges
      const badgeGrid = document.getElementById('badgeGrid');
      badgeGrid.innerHTML = state.badges.map(b => `
        <div class="badge-item" onclick='quickLogBadge(${JSON.stringify(b)})'>
          <span>${b.name}</span>
          <span>$${b.amount}</span>
        </div>
      `).join('');

      // Bank Accounts
      const accList = document.getElementById('accountList');
      accList.innerHTML = state.accounts.map(a => `
        <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
          <span>${a.name}</span>
          <strong>$${a.balance.toFixed(2)}</strong>
        </div>
      `).join('');

      // Category Budgets Progress
      const budgetList = document.getElementById('budgetList');
      budgetList.innerHTML = state.categories.map(c => {
        const spent = state.transactions.filter(t => t.category === c.name && t.type === 'expense').reduce((s,t) => s + t.amount, 0);
        const pct = Math.min(100, (spent / c.limit) * 100);
        let statusClass = '';
        if (pct > 85) statusClass = 'danger';
        else if (pct > 65) statusClass = 'warn';

        return `
          <div style="margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
              <span>${c.name}</span>
              <span>$${spent.toFixed(0)} / $${c.limit}</span>
            </div>
            <div class="progress-bg">
              <div class="progress-fill ${statusClass}" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      // Transactions History
      const txList = document.getElementById('txList');
      txList.innerHTML = state.transactions.slice(0, 8).map(tx => `
        <div class="tx-item">
          <div>
            <strong>${tx.title}</strong>
            <div style="font-size:0.75rem; color:#777;">${tx.category} • ${tx.account}</div>
          </div>
          <div class="tx-amount ${tx.type}">
            ${tx.type === 'expense' ? '-' : '+'}$${tx.amount.toFixed(2)}
          </div>
        </div>
      `).join('');

      drawChart();
    }

    render();
  </script>
</body>
</html>
